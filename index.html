<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PHOENIX RIDERS</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phoenix Riders">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap');

:root{
  /* iOS dark system palette */
  --bg:#000000;
  --bg-elevated:#0c0c0e;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --panel3:#3a3a3c;
  --border:#38383a;
  --sep:rgba(84,84,88,0.36);
  --text:#f2f2f7;
  --muted:#98989f;
  --muted2:#636366;
  --flame1:#ff5b1e;
  --flame2:#ffb020;
  --flame3:#ff2d55;
  --grad: linear-gradient(120deg,var(--flame3) 0%, var(--flame1) 55%, var(--flame2) 100%);
  --success:#30d158;
  --warn:#ffd60a;
  --danger:#ff453a;
  --info:#0a84ff;
  --radius:16px;
  --font-en: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif;
  --font-ar: 'Tajawal', -apple-system, sans-serif;
  --font-ui: var(--font-en);
}
html[dir="rtl"]{ --font-ui: var(--font-ar); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{
  font-family:var(--font-ui);
  color:var(--text);
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
.phx-font{font-family:'Orbitron',sans-serif; letter-spacing:1.5px;}
/* logo-style "sliced" heading treatment, echoes the mark's cut lettering */
.phx-slice{
  font-family:'Orbitron',sans-serif; font-weight:800; letter-spacing:2px;
  -webkit-mask-image:repeating-linear-gradient(to bottom, #000 0 44%, transparent 44% 56%, #000 56% 100%);
  mask-image:repeating-linear-gradient(to bottom, #000 0 44%, transparent 44% 56%, #000 56% 100%);
}
#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; background:
  radial-gradient(1100px 460px at 50% -12%, rgba(255,91,30,0.09), transparent 60%), var(--bg);
  padding-bottom:88px;}
::-webkit-scrollbar{width:0;height:0;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
[dir="rtl"] .ltr-only{direction:ltr;}

/* ---------- top header (iOS large-title nav bar) ---------- */
.topbar{position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px; background:rgba(0,0,0,0.78);
  backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:0.5px solid var(--sep);}
.brand{display:flex; align-items:center; gap:9px;}
.brand-logo{width:32px;height:32px;flex:none; border-radius:8px; overflow:hidden;}
.brand-logo img{width:100%;height:100%;object-fit:contain;}
.brand-text{font-weight:800; font-size:14px; letter-spacing:2px;}
.brand-sub{font-size:8.5px; color:var(--muted2); letter-spacing:2.4px; margin-top:-1px;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.user-chip{display:flex; align-items:center; gap:6px; background:var(--panel); border:0.5px solid var(--border);
  border-radius:20px; padding:5px 12px 5px 6px; font-size:12px;}
.user-chip .avatar{width:22px;height:22px;border-radius:50%; background:var(--grad); display:flex; align-items:center; justify-content:center; font-size:11px;}

/* ---------- content ---------- */
.screen{padding:6px 16px 24px;}
.h1{font-size:22px; font-weight:800; margin:8px 0 14px; letter-spacing:0.2px;}
.section-title{font-size:12px; font-weight:700; color:var(--muted); margin:22px 4px 8px; display:flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:0.4px;}

/* iOS grouped list card */
.card{background:var(--panel); border:0.5px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; position:relative; overflow:hidden;}
.card.glow::before{content:'';position:absolute; inset:-1px; border-radius:var(--radius); padding:1px;
  background:var(--grad); -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; opacity:.6; pointer-events:none;}

/* iOS grouped list (settings-style rows inside one rounded container) */
.ios-list{background:var(--panel); border:0.5px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px;}
.ios-row{display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:0.5px solid var(--sep); cursor:pointer;}
.ios-row:last-child{border-bottom:none;}
.ios-row .row-label{flex:1; font-size:15px;}
.ios-row .row-value{color:var(--muted); font-size:13.5px;}
.chev{color:var(--muted2); font-size:16px;}
[dir="rtl"] .chev{transform:scaleX(-1);}

.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:8px;}
.stat-box{background:var(--panel); border:0.5px solid var(--border); border-radius:var(--radius); padding:14px; text-align:center;}
.stat-num{font-family:'Orbitron',sans-serif; font-size:22px; font-weight:800; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.stat-label{font-size:11px; color:var(--muted); margin-top:3px;}

.big-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:16px;
  border-radius:14px; border:none; font-weight:700; font-size:15px; cursor:pointer; margin-bottom:10px;
  background:var(--grad); color:#0a0a0d; box-shadow:0 8px 24px -8px rgba(255,45,85,0.45);}
.big-btn.secondary{background:var(--panel2); color:var(--text); border:0.5px solid var(--border); box-shadow:none;}
.btn-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.btn{padding:12px 14px; border-radius:12px; border:0.5px solid var(--border); background:var(--panel2); color:var(--text); font-weight:600; font-size:13.5px; cursor:pointer;}
.btn.primary{background:var(--grad); color:#0a0a0d; border:none; font-weight:700;}
.btn.ghost{background:transparent;}
.btn.danger{background:rgba(255,69,58,0.14); color:var(--danger); border:0.5px solid rgba(255,69,58,0.4);}
.btn.success{background:rgba(48,209,88,0.14); color:var(--success); border:0.5px solid rgba(48,209,88,0.4);}
.btn.full{width:100%;}
.btn:disabled{opacity:.4;}

input,textarea,select{width:100%; background:var(--panel2); border:0.5px solid var(--border); color:var(--text);
  border-radius:11px; padding:12px 13px; font-size:15px; font-family:inherit; margin-bottom:10px;}
input::placeholder,textarea::placeholder{color:var(--muted2);}
label{font-size:12px; color:var(--muted); margin-bottom:4px; display:block;}
.field{margin-bottom:12px;}

/* iOS-style switch */
.ios-switch{position:relative; width:51px; height:31px; border-radius:16px; background:var(--panel3); flex:none; cursor:pointer; transition:background .2s;}
.ios-switch.on{background:var(--success);}
.ios-switch .knob{position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.3); transition:transform .2s;}
.ios-switch.on .knob{transform:translateX(20px);}
[dir="rtl"] .ios-switch.on .knob{transform:translateX(-20px);}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:700; letter-spacing:0.3px;}
.pill.founder{background:linear-gradient(120deg,#ffb020,#ff2d55); color:#0a0a0d;}
.pill.admin{background:rgba(10,132,255,0.16); color:var(--info);}
.pill.member{background:var(--panel2); color:var(--muted);}
.pill.online{background:rgba(48,209,88,0.16); color:var(--success);}
.pill.offline{background:var(--panel2); color:var(--muted2);}

.rider-row{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--panel); border:0.5px solid var(--border); border-radius:14px; margin-bottom:8px; cursor:pointer;}
.rider-avatar{width:44px;height:44px;border-radius:50%; background:var(--grad); display:flex; align-items:center; justify-content:center; font-size:19px; flex:none; position:relative;}
.online-dot{width:10px;height:10px;border-radius:50%; background:var(--success); border:2px solid var(--panel); position:absolute; bottom:-1px; left:-1px;}
[dir="rtl"] .online-dot{left:auto; right:-1px;}
.rider-info{flex:1; min-width:0;}
.rider-name{font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px;}
.rider-bike{font-size:12px; color:var(--muted); margin-top:1px;}
.rider-meta{text-align:end; font-size:11px; color:var(--muted);}

.ride-card{background:var(--panel); border:0.5px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.ride-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; gap:8px;}
.ride-name{font-weight:800; font-size:15px;}
.ride-status{font-size:10px; padding:3px 8px; border-radius:8px; font-weight:700; white-space:nowrap;}
.ride-status.upcoming{background:rgba(10,132,255,0.16); color:var(--info);}
.ride-status.active{background:rgba(48,209,88,0.16); color:var(--success); animation:pulse 1.6s infinite;}
.ride-status.completed{background:var(--panel2); color:var(--muted);}
.ride-status.cancelled{background:rgba(255,69,58,0.16); color:var(--danger);}
.ride-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-bottom:4px;}
.join-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:10px;}
.join-btn{padding:8px 4px; border-radius:10px; text-align:center; font-size:11.5px; font-weight:700; border:0.5px solid var(--border); background:var(--panel2); cursor:pointer;}
.join-btn.active.join{background:rgba(48,209,88,0.18); color:var(--success); border-color:var(--success);}
.join-btn.active.maybe{background:rgba(255,214,10,0.18); color:var(--warn); border-color:var(--warn);}
.join-btn.active.not{background:rgba(255,69,58,0.18); color:var(--danger); border-color:var(--danger);}

.nav{position:fixed; bottom:0; left:0; right:0; z-index:50; display:flex; justify-content:center;}
.nav-inner{width:100%; max-width:520px; background:rgba(10,10,12,0.86); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border-top:0.5px solid var(--sep);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; cursor:pointer; color:var(--muted2); font-size:9.5px; font-weight:600;}
.nav-item .ic{font-size:19px;}
.nav-item.active{color:var(--flame2);}

.emg-fab{position:fixed; z-index:60; inset-inline-start:16px; bottom:calc(78px + env(safe-area-inset-bottom)); width:54px; height:54px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff6961, var(--danger)); border:none; color:#fff; font-size:22px;
  box-shadow:0 0 0 0 rgba(255,69,58,0.6); animation:emgpulse 2.2s infinite; cursor:pointer;
  display:flex; align-items:center; justify-content:center;}
@keyframes emgpulse{0%{box-shadow:0 0 0 0 rgba(255,69,58,.55);}70%{box-shadow:0 0 0 16px rgba(255,69,58,0);}100%{box-shadow:0 0 0 0 rgba(255,69,58,0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.72); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.modal{width:100%; max-width:520px; background:var(--bg-elevated); border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; border:0.5px solid var(--border); border-bottom:none; animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-handle{width:36px;height:5px;background:var(--panel3); border-radius:4px; margin:0 auto 14px;}
.modal-title{font-size:17px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px;}

/* iOS segmented control */
.tabs2{display:flex; gap:2px; margin-bottom:14px; background:var(--panel2); padding:2px; border-radius:9px;}
.tab2{flex:1; text-align:center; padding:7px 4px; border-radius:7px; font-size:12px; font-weight:600; color:var(--muted); cursor:pointer;}
.tab2.active{background:var(--panel3); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.4);}

.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 230px); min-height:340px;}
.chat-msgs{flex:1; overflow-y:auto; padding:6px 2px 10px; display:flex; flex-direction:column; gap:8px;}
.msg{max-width:78%; padding:9px 12px; border-radius:16px; font-size:14px; line-height:1.5;}
.msg.mine{align-self:flex-end; background:var(--info); color:#fff; border-bottom-right-radius:4px;}
[dir="rtl"] .msg.mine{border-bottom-right-radius:16px; border-bottom-left-radius:4px;}
.msg.theirs{align-self:flex-start; background:var(--panel2); border:0.5px solid var(--border); border-bottom-left-radius:4px;}
[dir="rtl"] .msg.theirs{border-bottom-left-radius:16px; border-bottom-right-radius:4px;}
.msg.system{align-self:center; background:transparent; color:var(--muted2); font-size:11px;}
.msg-name{font-size:10.5px; font-weight:700; opacity:.75; margin-bottom:2px;}
.chat-input-row{display:flex; gap:8px; padding-top:8px; border-top:0.5px solid var(--sep);}
.chat-input-row input{margin-bottom:0; flex:1;}
.send-btn{width:44px;height:44px; border-radius:50%; background:var(--info); border:none; color:#fff; font-size:16px; flex:none; cursor:pointer;}

#map, #servicesMap{width:100%; height:340px; border-radius:var(--radius); overflow:hidden; border:0.5px solid var(--border); margin-bottom:12px;}
.leaflet-container{background:#111 !important;}
.live-badge{display:inline-flex; align-items:center; gap:6px; background:rgba(48,209,88,0.14); color:var(--success); padding:5px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.dot-live{width:7px;height:7px;border-radius:50%; background:var(--success); animation:pulse 1.2s infinite;}
.pin-icon{background:var(--grad); width:30px;height:30px;border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; border:2px solid #0a0a0d; box-shadow:0 2px 8px rgba(0,0,0,.5);}
.pin-icon span{transform:rotate(45deg); font-size:14px;}

.empty{text-align:center; padding:40px 20px; color:var(--muted);}
.empty .ic{font-size:34px; margin-bottom:8px;}

.splash{position:fixed; inset:0; background:var(--bg); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;}
.splash-logo{width:96px;height:96px; overflow:hidden; animation:ignite 1.1s ease;}
.splash-logo img{width:100%;height:100%;object-fit:contain;}
@keyframes ignite{0%{transform:scale(.4) rotate(-20deg); opacity:0;}55%{transform:scale(1.1) rotate(3deg); opacity:1;}100%{transform:scale(1) rotate(0);}}
.splash-word{font-size:24px; font-weight:800; letter-spacing:3px;}
.splash-sub{font-size:11px; letter-spacing:3px; color:var(--muted);}

.badge-count{background:var(--danger); color:#fff; font-size:9px; font-weight:800; border-radius:10px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 4px; position:absolute; top:-4px; inset-inline-start:14px;}

.toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--panel2); border:0.5px solid var(--border); padding:10px 18px; border-radius:30px; font-size:13px; z-index:300; box-shadow:0 8px 20px rgba(0,0,0,.4); max-width:88%; text-align:center;}

.divider{height:0.5px; background:var(--sep); margin:14px 0;}
.hint{font-size:11.5px; color:var(--muted2); margin-top:-4px; margin-bottom:10px;}
.level-tag{font-size:10px; padding:2px 7px; border-radius:8px; background:var(--panel2); font-family:'Orbitron',sans-serif; letter-spacing:0.5px; display:inline-flex; align-items:center; gap:4px;}
.ico{display:inline-block; vertical-align:-3px; flex:none;}
.stat-dot{width:7px;height:7px;border-radius:50%; display:inline-block; margin-inline-end:5px; flex:none;}
.avatar-initials{font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:0.5px; color:#0a0a0d;}
</style>
</head>

function I(name, size){
  size = size||16;

function initials(name){
  if(!name) return '';
  const parts = name.trim().split(/\s+/);
  return parts.slice(0,2).map(p=>p[0]).join('').toUpperCase();
}

function tr(key){ return (STRINGS[S.lang] && STRINGS[S.lang][key]) || STRINGS.en[key] || key; }

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  const ar = S.lang==='ar';
  if(s<60) return ar? 'الآن' : 'now';
  if(s<3600) return ar? `منذ ${Math.floor(s/60)} د` : `${Math.floor(s/60)}m ago`;
  if(s<86400) return ar? `منذ ${Math.floor(s/3600)} س` : `${Math.floor(s/3600)}h ago`;
  return ar? `منذ ${Math.floor(s/86400)} يوم` : `${Math.floor(s/86400)}d ago`;
}
function fmtDate(d){
  try{ return new Date(d).toLocaleDateString(S.lang==='ar'?'ar-JO':'en-US',{weekday:'short', day:'numeric', month:'short'}); }catch(e){return d;}
}

/* ---------- storage helpers (Firebase Firestore) ----------
   Every key from the original design (e.g. "members", "rides",
   "chat:main", "live:<rideId>:<memberId>") becomes one Firestore
   document inside the "phoenix_riders" collection, storing {value: <JSON string>}.
   This keeps every other function in the app completely unchanged. */
let _fbDb = null;
function fbDb(){
  if(_fbDb) return _fbDb;
  if(!window.firebase || !firebase.apps || !firebase.apps.length){
    console.error('Firebase is not initialized — check firebaseConfig at the top of the script.');
    return null;
  }
  _fbDb = firebase.firestore();
  return _fbDb;
}
async function sGet(key, fallback){
  try{
    const db = fbDb(); if(!db) return fallback;
    const doc = await db.collection('phoenix_riders').doc(key).get();
    if(!doc.exists) return fallback;
    const data = doc.data();
    return JSON.parse(data.value);
  }catch(e){ console.error('sGet failed', key, e); return fallback; }
}
async function sSet(key, value){
  try{
    const db = fbDb(); if(!db) return false;
    await db.collection('phoenix_riders').doc(key).set({ value: JSON.stringify(value), updatedAt: Date.now() });
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}
async function sList(prefix){
  try{
    const db = fbDb(); if(!db) return [];
    const end = prefix + '\uf8ff';
    const snap = await db.collection('phoenix_riders')
      .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
      .where(firebase.firestore.FieldPath.documentId(), '<=', end)
      .get();
    return snap.docs.map(d => d.id);
  }catch(e){ console.error('sList failed', prefix, e); return []; }
}
async function sDelete(key){
  try{
    const db = fbDb(); if(!db) return;
    await db.collection('phoenix_riders').doc(key).delete();
  }catch(e){ console.error('sDelete failed', key, e); }
}

/* ======================= BOOT ======================= */
async function boot(){
  let members = await sGet('members', null);
  if(!members || !members.length){
    members = [seedFounder()];
    await sSet('members', members);
  }
  S.members = members;
  S.rides = await sGet('rides', []);
  S.announcements = await sGet('announcements', []);
  S.emergencies = await sGet('emergencies', []);
  S.booted = true;
  applyLangToDom();
  render();
  startPolling();
}

function startPolling(){
  if(S.pollHandle) clearInterval(S.pollHandle);
  S.pollHandle = setInterval(async ()=>{
    if(!S.currentUserId) return;
    await sSet('presence:'+S.currentUserId, {ts:nowTs()});
    const [members, rides, announcements, emergencies, presenceKeys] = await Promise.all([
      sGet('members', S.members),
      sGet('rides', S.rides),
      sGet('announcements', S.announcements),
      sGet('emergencies', S.emergencies),
      sList('presence:'),
    ]);
    S.members = members; S.rides = rides; S.announcements = announcements; S.emergencies = emergencies;
    const pres = {};
    for(const k of presenceKeys){
      const val = await sGet(k, null);
      if(val) pres[k.replace('presence:','')] = val.ts;
    }
    S.presence = pres;
    if(S.chatScope){ S.chatMsgs = await sGet(chatKey(S.chatScope), []); }
    if(S.liveRideId){ await pollLiveLocations(); }
    render(true);
  }, 5000);
}

function chatKey(scope){ return scope==='main' ? 'chat:main' : 'chat:ride:'+scope; }

async function tryLogin(memberId, pin){
  const m = S.members.find(x=>x.id===memberId);
  if(!m) return showToast(tr('memberNotFound'));
  if(m.status!=='approved') return showToast(tr('pendingApproval'));
  if(String(m.pin) !== String(pin)) return showToast(tr('wrongPin'));
  S.currentUserId = m.id;
  await sSet('presence:'+m.id, {ts:nowTs()});
  S.tab='home';
  render();
}

function logout(){
  if(S.liveSharing) stopLiveSharing();
  S.currentUserId = null;
  render();
}

async function requestJoin(name, phone, bike){
  const newMember = {
    id:uid(), name, phone, role:'member', status:'pending',
    bikes:[{id:uid(), manufacturer:bike||'', model:'', year:'', color:'', engine:'', mods:'', tires:'', notes:''}],
    avatar:'', points:0, ridesCount:0, distanceKm:0, pin: String(Math.floor(1000+Math.random()*9000)),
    createdAt: nowTs(),
  };
  const members = await sGet('members', S.members);
  members.push(newMember);
  await sSet('members', members);
  S.members = members;
  return newMember;
}

/* ======================= RENDER ROOT ======================= */
function render(silent){
  const app = document.getElementById('app');
  const toastHtml = S.toast ? `<div class="toast">${S.toast}</div>` : '';
  if(!S.booted){
    app.innerHTML = renderSplash() + toastHtml;
    return;
  }
  if(!S.currentUserId){
    app.innerHTML = renderLogin() + toastHtml;
    bindLoginEvents();
    return;
  }
  let body = '';
  if(S.tab==='home') body = renderHome();
  else if(S.tab==='riders') body = S.viewingRider ? renderRiderDetail(S.viewingRider) : renderRiders();
  else if(S.tab==='rides') body = S.viewingRide ? renderRideDetail(S.viewingRide) : renderRides();
  else if(S.tab==='map') body = renderLiveMap();
  else if(S.tab==='chat') body = renderChat();
  else if(S.tab==='profile') body = renderProfile();
  else if(S.tab==='admin') body = renderAdmin();
  else if(S.tab==='feed') body = renderFeed();
  else if(S.tab==='services') body = renderServices();

  app.innerHTML = `
    ${renderTopbar()}
    <div class="screen">${body}</div>
    ${renderEmgFab()}
    ${renderNav()}
    ${toastHtml}
  `;
  bindGlobalEvents();
  if(S.tab==='map') initOrUpdateMap();
  if(S.tab==='services') initServicesMap();
  if(S.tab==='chat') { const el=document.getElementById('chatMsgs'); if(el) el.scrollTop = el.scrollHeight; }
}

function initOrUpdateMap(){

  }

function pinDivIcon(kind){
  const bg = kind==='leader' ? 'background:linear-gradient(120deg,#ffb020,#ff2d55);' : kind==='self' ? 'background:var(--success);' : 'background:var(--info);';
  const glyph = kind==='leader' ? I('star',13) : '';
  return L.divIcon({
    className:'', html:`<div class="pin-icon" style="${bg} color:#0a0a0d;">${glyph?`<span>${glyph}</span>`:''}</div>`,
    iconSize:[30,30], iconAnchor:[15,30],
  });
}

async function pollLiveLocations(){
  if(!S.liveRideId || !S.mapObj) return;
  const keys = await sList('live:'+S.liveRideId+':');
  const bounds = [];
  const seen = new Set();
  const ride = S.rides.find(r=>r.id===S.liveRideId);
  let distHtml = '';
  for(const k of keys){
    const data = await sGet(k, null);
    if(!data) continue;
    const memberId = k.split(':')[2];
    const mem = S.members.find(x=>x.id===memberId);
    if(!mem) continue;
    if(nowTs() - data.ts > 10*60*1000) continue;
    seen.add(memberId);
    const isLeader = ride && ride.leaderId===memberId;
    const isSelf = memberId===S.currentUserId;
    const icon = pinDivIcon(isLeader?'leader':(isSelf?'self':'other'));
    if(S.liveMarkers[memberId]){
      S.liveMarkers[memberId].setLatLng([data.lat, data.lng]);
      S.liveMarkers[memberId].setIcon(icon);
    } else {
      S.liveMarkers[memberId] = L.marker([data.lat, data.lng], {icon}).addTo(S.mapObj).bindPopup(mem.name);
    }
    bounds.push([data.lat, data.lng]);
    distHtml += `<div class="ride-row"><span class="stat-dot" style="background:${isLeader?'var(--flame2)':'var(--info)'};"></span>${mem.name} — ${timeAgo(data.ts)}</div>`;
  }
  Object.keys(S.liveMarkers).forEach(mid=>{
    if(!seen.has(mid)){ S.mapObj.removeLayer(S.liveMarkers[mid]); delete S.liveMarkers[mid]; }
  });
  if(bounds.length){ try{ S.mapObj.fitBounds(bounds, {padding:[30,30], maxZoom:14}); }catch(e){} }
  const listEl = document.getElementById('riderDistList');
  if(listEl) listEl.innerHTML = distHtml ? `<div class="section-title">${I('users',14)} ${tr('sharingLocation')}</div><div class="card">${distHtml}</div>` : '';
}

function startLiveSharing(){
  if(!navigator.geolocation) return showToast(tr('gpsUnsupported'));
  S.liveSharing = true;
  render();
  let lastWrite = 0;
  S.liveWatchId = navigator.geolocation.watchPosition(async (pos)=>{
    const t = Date.now();
    if(t - lastWrite < 8000) return;
    lastWrite = t;
    await sSet('live:'+S.liveRideId+':'+S.currentUserId, {lat:pos.coords.latitude, lng:pos.coords.longitude, ts:nowTs()});
    if(S.mapObj) pollLiveLocations();
  }, (err)=>{ showToast(tr('couldNotLocate')); S.liveSharing=false; render(); },
  {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
}
function stopLiveSharing(){
  if(S.liveWatchId!==null && navigator.geolocation){ navigator.geolocation.clearWatch(S.liveWatchId); }
  S.liveWatchId = null;
  S.liveSharing = false;
  if(S.liveRideId) sDelete('live:'+S.liveRideId+':'+S.currentUserId);
  render();
}

function chatMsgHtml(msg){
  const mine = msg.senderId===S.currentUserId;
  if(msg.system) return `<div class="msg system">${msg.text}</div>`;
  return `<div class="msg ${mine?'mine':'theirs'}">${!mine?`<div class="msg-name">${msg.senderName}</div>`:''}${msg.text}</div>`;

async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  const key = chatKey(S.chatScope);
  const msgs = await sGet(key, []);
  msgs.push({id:uid(), senderId:S.currentUserId, senderName:me().name, text, ts:nowTs()});
  if(msgs.length>300) msgs.splice(0, msgs.length-300);
  await sSet(key, msgs);
  S.chatMsgs = msgs;
  render();
}

async function startRecording(){
  if(S.isRecording) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showToast(tr('micDenied')); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream);
    S.recordedChunks = [];
    mr.ondataavailable = e=>{ if(e.data.size>0) S.recordedChunks.push(e.data); };
    mr.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(S.recordedChunks, {type: mr.mimeType || 'audio/webm'});
      const reader = new FileReader();
      reader.onload = async ()=>{
        const notes = await sGet('voice:'+S.voiceChannel, []);
        notes.push({id:uid(), senderId:S.currentUserId, senderName:me().name, audio:reader.result, ts:nowTs()});
        if(notes.length>25) notes.splice(0, notes.length-25);
        await sSet('voice:'+S.voiceChannel, notes);
        S.voiceNotes = notes;
        showToast(tr('voiceSent'));
        render();
      };
      reader.readAsDataURL(blob);
    };
    S.mediaRecorder = mr;
    mr.start();
    S.isRecording = true;
    render();
    S._recTimeout = setTimeout(()=>{ if(S.isRecording) stopRecording(); }, 15000);
  }catch(e){
    showToast(tr('micDenied'));
  }
}
function stopRecording(){
  if(!S.isRecording) return;
  if(S._recTimeout) clearTimeout(S._recTimeout);
  if(S.mediaRecorder){ try{ S.mediaRecorder.stop(); }catch(e){} }
  S.isRecording = false;
  render();
}

function openPostForm(){
  const box = document.createElement('div');
  document.body.appendChild(box);
  box.innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this) this.parentNode.remove()">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">${I('image',18)} ${tr('newPost')}</div>
      <textarea id="post_caption" rows="3" placeholder="${tr('writeCaption')}"></textarea>

      <div id="post_preview"></div>
      <button class="btn primary full" onclick="submitPost(this)">${I('check',16)} ${tr('post')}</button>
    </div>
  </div>`;
  document.getElementById('post_image').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const dataUrl = await compressImage(file, 640, 0.55);
    document.getElementById('post_preview').innerHTML = `<img src="${dataUrl}" style="width:100%; border-radius:12px; margin-bottom:10px;">`;
    box.dataset.image = dataUrl;
  });
}
function compressImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = img.width*scale, h = img.height*scale;
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function submitPost(btn){

      <div class="card">
        <div class="rider-name">${m.name}</div>
        <div class="hint">${I('phone',12)} ${m.phone||'—'} · ${I('bike',12)} ${bikeLabel(m)}</div>
        <div class="btn-row">
          <button class="btn success" onclick="approveMember('${m.id}')">${I('check',16)} ${tr('approve')}</button>
          <button class="btn danger" onclick="removeMember('${m.id}')">${I('xCircle',16)} ${tr('reject')}</button>
        </div>
      </div>
    `).join('')}` : ''}

    <div class="section-title">${I('users',14)} ${tr('adminMembers')} (${approved.length})</div>
    ${approved.map(m=>`
      <div class="card">
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="rider-avatar avatar-initials" style="width:36px;height:36px;font-size:13px;">${initials(m.name)}</div>
          <div style="flex:1;">
            <div class="rider-name">${m.name} ${roleBadge(m.role)}</div>
            <div class="hint" style="margin:0;">PIN: ${m.pin} · ${m.points||0} ${tr('points')}</div>
          </div>
        </div>
        ${m.role!=='founder' ? `
        <div class="btn-row" style="margin-top:8px;">
          <select onchange="changeRole('${m.id}', this.value)" style="margin-bottom:0;">
            <option value="member" ${m.role==='member'?'selected':''}>${tr('roleMember')}</option>
            <option value="moderator" ${m.role==='moderator'?'selected':''}>${tr('roleModerator')}</option>
            <option value="admin" ${m.role==='admin'?'selected':''}>${tr('roleAdmin')}</option>
          </select>
          <button class="btn danger" onclick="removeMember('${m.id}')">${I('trash',16)} ${tr('remove')}</button>
        </div>` : ''}
      </div>
    `).join('')}
  `;
}
async function approveMember(id){
  const members = await sGet('members', S.members);
  const m = members.find(x=>x.id===id);
  if(m) m.status='approved';
  await sSet('members', members);
  S.members = members;
  showToast(tr('memberApproved'));
  render();
}
async function removeMember(id){
  if(!confirm(tr('confirmRemoveMember'))) return;
  const members = (await sGet('members', S.members)).filter(x=>x.id!==id);
  await sSet('members', members);
  S.members = members;
  render();
}
async function changeRole(id, role){
  const members = await sGet('members', S.members);
  const m = members.find(x=>x.id===id);
  if(m) m.role = role;
  await sSet('members', members);
  S.members = members;
  showToast(tr('roleUpdated'));
  render();
}
function renderAdminEmergencies(){
  const active = [...S.emergencies].filter(e=>e.status==='active').sort((a,b)=>b.ts-a.ts);
  const resolved = [...S.emergencies].filter(e=>e.status==='resolved').sort((a,b)=>b.ts-a.ts).slice(0,10);
  return `
    <div class="section-title">${I('alert',14)} ${tr('activeReports')} (${active.length})</div>
    ${active.map(e=>`
      <div class="card" style="border-color:rgba(255,69,58,0.5);">
        <div class="rider-name" style="color:var(--danger);">${I('alert',14)} ${e.memberName}</div>
        <div class="ride-row">${I('bike',14)} ${e.bike}</div>
        <div class="ride-row">${e.problemLabel}</div>
        <div class="ride-row">${I('clock',14)} ${timeAgo(e.ts)}</div>
        <div class="btn-row" style="margin-top:8px;">
          ${e.lat? `<a class="btn" href="https://www.google.com/maps?q=${e.lat},${e.lng}" target="_blank">${I('pin',16)} ${tr('viewLocation')}</a>` : `<div class="hint">${tr('noExactLocation')}</div>`}
          <button class="btn success" onclick="resolveEmergency('${e.id}')">${I('check',16)} ${tr('markResolved')}</button>
        </div>
      </div>
    `).join('') || `<div class="empty">${tr('noActiveReports')}</div>`}
    ${resolved.length? `<div class="section-title">${I('check',14)} ${tr('resolvedReports')}</div>${resolved.map(e=>`
      <div class="card" style="opacity:.6;"><div class="rider-name">${e.memberName} — ${e.problemLabel}</div><div class="hint">${timeAgo(e.ts)}</div></div>
    `).join('')}`:''}
  `;
}
function renderAdminAnnouncements(){
  return `
    <div class="card">
      <div class="field"><label>${tr('announcementTitle')}</label><input id="an_title" placeholder="${tr('announcementTitlePh')}"></div>
      <div class="field"><label>${tr('announcementBody')}</label><textarea id="an_body" rows="3" placeholder="${tr('announcementBodyPh')}"></textarea></div>
      <button class="btn primary full" onclick="sendAnnouncement()">${tr('publish')}</button>
    </div>
    <div class="section-title">${I('bell',14)} ${tr('previousAnnouncements')}</div>
    ${[...S.announcements].reverse().map(a=>`
      <div class="card"><div class="rider-name">${a.title}</div><div style="font-size:13px; color:var(--muted); white-space:pre-wrap;">${a.body}</div><div class="hint">${timeAgo(a.ts)}</div></div>
    `).join('') || `<div class="empty">${tr('noAnnouncements')}</div>`}
  `;
}
async function sendAnnouncement(){
  const title = document.getElementById('an_title').value.trim();
  const body = document.getElementById('an_body').value.trim();
  if(!title) return showToast(tr('titleRequired'));
  const list = await sGet('announcements', S.announcements);
  list.push({id:uid(), title, body, ts:nowTs(), authorId:S.currentUserId});
  await sSet('announcements', list);
  S.announcements = list;
  const msgs = await sGet('chat:main', []);
  msgs.push({id:uid(), system:true, text:`${tr('latestAnnouncement')}: ${title}`, ts:nowTs()});
  await sSet('chat:main', msgs);
  showToast(tr('announcementSent'));
  render();
}
function renderAdminRides(){
  return `
    <button class="big-btn" onclick="openRideForm()">${I('plus',18)} ${tr('createRideAdmin')}</button>
    ${S.rides.slice().reverse().map(rideCardHtml).join('') || `<div class="empty">${tr('noRides')}</div>`}
  `;
}

/* ======================= START ======================= */
boot();
</script>
</body>
</html>
